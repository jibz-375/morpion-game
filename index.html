<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe - Ultimate Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.75);
            --cell-bg: rgba(15, 23, 42, 0.8);
            --cell-hover: rgba(51, 65, 85, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --x-color: #38bdf8;
            --x-glow: rgba(56, 189, 248, 0.6);
            --o-color: #f43f5e;
            --o-glow: rgba(244, 63, 94, 0.6);
            --accent: #8b5cf6;
        }

        /* Thèmes déblocables */
        body.theme-retro {
            --bg-gradient: linear-gradient(135deg, #2e1065 0%, #701a75 100%);
            --panel-bg: rgba(46, 16, 101, 0.8);
            --cell-bg: rgba(24, 9, 53, 0.85);
            --border-color: rgba(244, 114, 182, 0.3);
        }

        body.theme-ice {
            --bg-gradient: linear-gradient(135deg, #083344 0%, #0f172a 100%);
            --panel-bg: rgba(12, 74, 110, 0.7);
            --cell-bg: rgba(8, 47, 73, 0.85);
            --border-color: rgba(125, 211, 252, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            transition: background 0.5s ease;
        }

        .game-container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Barre XP & Niveau */
        .xp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 14px;
            border-radius: 12px;
        }

        .level-badge {
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .xp-bar-container {
            flex-grow: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 0 12px;
            overflow: hidden;
        }

        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            width: 0%;
            transition: width 0.4s ease;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #38bdf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Contrôles de mode */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #e2e8f0;
            padding: 9px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }

        .btn.active {
            background: var(--accent);
            border-color: #a78bfa;
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .difficulty-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .difficulty-bar .btn {
            flex: 1;
            font-size: 0.8rem;
            padding: 7px;
        }

        .variants-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .variants-bar .btn {
            flex: 1;
            font-size: 0.8rem;
        }

        /* Scores */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .score-box span {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .score-box strong {
            font-size: 1.3rem;
        }

        .score-x strong { color: var(--x-color); }
        .score-o strong { color: var(--o-color); }

        /* Statut & Chrono */
        .status-area {
            text-align: center;
            margin-bottom: 14px;
        }

        .status-text {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            min-height: 24px;
        }

        .timer-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .timer-bar-fill {
            height: 100%;
            background: #f59e0b;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* Plateau */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--cell-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .cell:hover:not(.taken) {
            background: var(--cell-hover);
            transform: scale(1.03);
        }

        .cell.x-mark {
            color: var(--x-color);
            text-shadow: 0 0 20px var(--x-glow);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cell.o-mark {
            color: var(--o-color);
            text-shadow: 0 0 20px var(--o-glow);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cell.fading-out {
            opacity: 0.4;
            border: 1px dashed #f59e0b;
        }

        .cell.win-cell {
            background: rgba(139, 92, 246, 0.35);
            border-color: #a78bfa;
            transform: scale(1.05);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Taunts (Emojis) */
        .taunts-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .taunt-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .taunt-btn:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.18);
        }

        .floating-taunt {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            pointer-events: none;
            z-index: 20;
            animation: floatUp 1.2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -30%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
        }

        /* Actions du bas */
        .bottom-actions {
            display: flex;
            gap: 10px;
        }

        .bottom-actions .btn {
            flex: 1;
            padding: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            border: none;
            color: white;
        }

        /* Modale Boutique & Succès */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 15px;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .shop-section {
            margin-bottom: 18px;
        }

        .shop-section h4 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .skin-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .skin-item.selected {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        .skin-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .achievement-item {
            background: rgba(15, 23, 42, 0.7);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.45;
        }

        .achievement-item.unlocked {
            opacity: 1;
            border: 1px solid rgba(250, 204, 21, 0.4);
        }
    </style>
</head>
<body>

<div class="game-container" id="gameContainer">
    <!-- Barre de progression XP -->
    <div class="xp-header">
        <span class="level-badge" id="levelBadge">Niv. 1</span>
        <div class="xp-bar-container">
            <div class="xp-bar-fill" id="xpBarFill"></div>
        </div>
        <span id="xpText">0 / 100 XP</span>
    </div>

    <header>
        <h1>NEON TIC-TAC-TOE</h1>
    </header>

    <!-- Sélection Mode de jeu -->
    <div class="controls-grid">
        <button class="btn active sound-btn" id="btnModeAI" onclick="setGameMode('AI')">
            <i class="fas fa-robot"></i> Solo (vs IA)
        </button>
        <button class="btn sound-btn" id="btnMode2P" onclick="setGameMode('2P')">
            <i class="fas fa-user-friends"></i> 2 Joueurs
        </button>
    </div>

    <!-- Sélection Difficulté IA -->
    <div class="difficulty-bar" id="difficultyBar">
        <button class="btn active sound-btn" id="diffSuperEasy" onclick="setDifficulty('SuperEasy')">Super Facile</button>
        <button class="btn sound-btn" id="diffEasy" onclick="setDifficulty('Easy')">Facile</button>
        <button class="btn sound-btn" id="diffHard" onclick="setDifficulty('Hard')">Difficile</button>
    </div>

    <!-- Variantes de jeu -->
    <div class="variants-bar">
        <button class="btn sound-btn" id="btnInfinite" onclick="toggleVariant('infinite')">
            <i class="fas fa-infinity"></i> Mode Infini
        </button>
        <button class="btn sound-btn" id="btnSpeed" onclick="toggleVariant('speed')">
            <i class="fas fa-stopwatch"></i> Chrono (5s)
        </button>
    </div>

    <!-- Tableau des scores -->
    <div class="scoreboard">
        <div class="score-box score-x">
            <span id="labelPlayerX">JOUEUR (X)</span>
            <strong id="scoreX">0</strong>
        </div>
        <div class="score-box">
            <span>ÉGALITÉS</span>
            <strong id="scoreDraw">0</strong>
        </div>
        <div class="score-box score-o">
            <span id="labelPlayerO">IA (O)</span>
            <strong id="scoreO">0</strong>
        </div>
    </div>

    <!-- Statut et Chrono -->
    <div class="status-area">
        <div class="status-text" id="statusText">Au tour de X</div>
        <div class="timer-bar-container" id="timerContainer">
            <div class="timer-bar-fill" id="timerFill"></div>
        </div>
    </div>

    <!-- Plateau 3x3 -->
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <!-- Taunts / Emojis -->
    <div class="taunts-bar">
        <button class="taunt-btn sound-btn" onclick="sendTaunt('😎')">😎</button>
        <button class="taunt-btn sound-btn" onclick="sendTaunt('😂')">😂</button>
        <button class="taunt-btn sound-btn" onclick="sendTaunt('😱')">😱</button>
        <button class="taunt-btn sound-btn" onclick="sendTaunt('👑')">👑</button>
        <button class="taunt-btn sound-btn" onclick="sendTaunt('🔥')">🔥</button>
    </div>

    <!-- Boutons du bas -->
    <div class="bottom-actions">
        <button class="btn btn-primary sound-btn" onclick="resetGame()">
            <i class="fas fa-redo"></i> Rejouer
        </button>
        <button class="btn sound-btn" onclick="openModal('shopModal')">
            <i class="fas fa-palette"></i> Skins (<span id="totalWinsBadge">0</span> 🏆)
        </button>
        <button class="btn sound-btn" onclick="openModal('achievementsModal')">
            <i class="fas fa-medal"></i> Succès
        </button>
    </div>
</div>

<!-- Modale Boutique & Cosmétiques -->
<div class="modal-overlay" id="shopModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="fas fa-palette"></i> Personnalisation</h3>
            <button class="close-modal sound-btn" onclick="closeModal('shopModal')">×</button>
        </div>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px;">
            Gagne des parties pour débloquer de nouveaux symboles et thèmes !
        </p>

        <div class="shop-section">
            <h4>Symbole Joueur 1 (X)</h4>
            <div class="skins-grid" id="skinsXGrid"></div>
        </div>

        <div class="shop-section">
            <h4>Symbole Joueur 2 / IA (O)</h4>
            <div class="skins-grid" id="skinsOGrid"></div>
        </div>

        <div class="shop-section">
            <h4>Thèmes du Plateau</h4>
            <div class="skins-grid" id="themesGrid"></div>
        </div>
    </div>
</div>

<!-- Modale Succès -->
<div class="modal-overlay" id="achievementsModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="fas fa-medal"></i> Succès</h3>
            <button class="close-modal sound-btn" onclick="closeModal('achievementsModal')">×</button>
        </div>
        <div id="achievementsList"></div>
    </div>
</div>

<script>
    // --- AUDIO SYNTHÉTISÉ (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
            osc.start(now);
            osc.stop(now + 0.06);
        } else if (type === 'moveX') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'moveO') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(340, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'win') {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, now + i * 0.09);
                g.gain.setValueAtTime(0.18, now + i * 0.09);
                g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.25);
                o.start(now + i * 0.09);
                o.stop(now + i * 0.09 + 0.25);
            });
        } else if (type === 'draw') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(180, now + 0.25);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        }
    }

    document.querySelectorAll('.sound-btn').forEach(btn => {
        btn.addEventListener('click', () => playSound('click'));
    });

    // --- DONNÉES ET SAUVEGARDE SÉCURISÉE ---
    let playerData = {
        totalWins: 0,
        xp: 0,
        level: 1,
        streak: 0,
        skinX: 'X',
        skinO: 'O',
        theme: 'default',
        achievements: []
    };

    try {
        const saved = localStorage.getItem('neon_ttt_save');
        if (saved) playerData = { ...playerData, ...JSON.parse(saved) };
    } catch (e) {}

    function saveData() {
        try {
            localStorage.setItem('neon_ttt_save', JSON.stringify(playerData));
        } catch (e) {}
        updateProgressionUI();
    }

    // --- CATALOGUE COSMÉTIQUES & SUCCÈS ---
    const SKINS_X = [
        { id: 'X', label: 'Classique (X)', req: 0 },
        { id: '🔥', label: 'Flamme', req: 3 },
        { id: '⚡', label: 'Éclair', req: 8 },
        { id: '👑', label: 'Couronne', req: 15 }
    ];

    const SKINS_O = [
        { id: 'O', label: 'Classique (O)', req: 0 },
        { id: '🔮', label: 'Orbe', req: 3 },
        { id: '☀️', label: 'Soleil', req: 8 },
        { id: '💎', label: 'Diamant', req: 15 }
    ];

    const THEMES = [
        { id: 'default', label: 'Néon Cyber', req: 0 },
        { id: 'retro', label: 'Rétro 80s', req: 5 },
        { id: 'ice', label: 'Givre Polaire', req: 12 }
    ];

    const ACHIEVEMENTS_DATA = [
        { id: 'first_win', title: 'Première Victoire', desc: 'Remporter 1 partie', icon: '🏆' },
        { id: 'fast_win', title: 'Victoire Éclair', desc: 'Gagner en 3 coups', icon: '⚡' },
        { id: 'bot_slayer', title: 'Tueur de Robots', desc: 'Battre l\'IA Difficile', icon: '🤖' },
        { id: 'on_fire', title: 'En Feu !', desc: 'Gagner 3 parties d\'affilée', icon: '🔥' }
    ];

    // --- ÉTAT DU JEU ---
    let board = Array(9).fill('');
    let currentTurn = 'X';
    let gameActive = true;
    let gameMode = 'AI'; // 'AI' ou '2P'
    let difficulty = 'SuperEasy'; // 'SuperEasy', 'Easy', 'Hard'
    let infiniteMode = false;
    let speedMode = false;
    let scores = { X: 0, O: 0, Draw: 0 };
    let moveHistory = { X: [], O: [] };
    let turnTimer = null;
    let timeLeft = 5000;

    const WIN_PATTERNS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell => {
        cell.addEventListener('click', () => handleCellClick(parseInt(cell.dataset.index)));
    });

    function setGameMode(mode) {
        gameMode = mode;
        document.getElementById('btnModeAI').classList.toggle('active', mode === 'AI');
        document.getElementById('btnMode2P').classList.toggle('active', mode === '2P');
        document.getElementById('difficultyBar').style.display = mode === 'AI' ? 'flex' : 'none';
        document.getElementById('labelPlayerX').textContent = mode === 'AI' ? 'VOUS (X)' : 'JOUEUR 1 (X)';
        document.getElementById('labelPlayerO').textContent = mode === 'AI' ? 'IA (O)' : 'JOUEUR 2 (O)';
        scores = { X: 0, O: 0, Draw: 0 };
        updateScoreboard();
        resetGame();
    }

    function setDifficulty(diff) {
        difficulty = diff;
        document.getElementById('diffSuperEasy').classList.toggle('active', diff === 'SuperEasy');
        document.getElementById('diffEasy').classList.toggle('active', diff === 'Easy');
        document.getElementById('diffHard').classList.toggle('active', diff === 'Hard');
        resetGame();
    }

    function toggleVariant(type) {
        if (type === 'infinite') {
            infiniteMode = !infiniteMode;
            document.getElementById('btnInfinite').classList.toggle('active', infiniteMode);
        } else if (type === 'speed') {
            speedMode = !speedMode;
            document.getElementById('btnSpeed').classList.toggle('active', speedMode);
        }
        resetGame();
    }

    function handleCellClick(index) {
        if (!gameActive || board[index] !== '') return;
        if (gameMode === 'AI' && currentTurn === 'O') return;

        makeMove(index, currentTurn);
    }

    function makeMove(index, player) {
        playSound(player === 'X' ? 'moveX' : 'moveO');

        // Gestion Mode Infini (Max 3 jetons par joueur)
        if (infiniteMode) {
            if (moveHistory[player].length >= 3) {
                const oldestIdx = moveHistory[player].shift();
                board[oldestIdx] = '';
                cells[oldestIdx].textContent = '';
                cells[oldestIdx].className = 'cell';
            }
            moveHistory[player].push(index);
        }

        board[index] = player;
        renderBoard();

        const winCombo = checkWin(player);
        if (winCombo) {
            endGame(player, winCombo);
            return;
        }

        if (!board.includes('')) {
            endGame('Draw');
            return;
        }

        currentTurn = currentTurn === 'X' ? 'O' : 'X';
        updateStatus();
        startTurnTimer();

        if (gameActive && gameMode === 'AI' && currentTurn === 'O') {
            setTimeout(makeAIMove, 450);
        }
    }

    function renderBoard() {
        cells.forEach((cell, idx) => {
            const val = board[idx];
            cell.classList.remove('fading-out');
            if (val === 'X') {
                cell.textContent = playerData.skinX;
                cell.className = 'cell taken x-mark';
            } else if (val === 'O') {
                cell.textContent = playerData.skinO;
                cell.className = 'cell taken o-mark';
            } else {
                cell.textContent = '';
                cell.className = 'cell';
            }
        });

        // Indiquer visuellement le pion qui va disparaître au prochain coup en Mode Infini
        if (infiniteMode && gameActive) {
            if (moveHistory[currentTurn].length === 3) {
                const nextRemove = moveHistory[currentTurn][0];
                cells[nextRemove].classList.add('fading-out');
            }
        }
    }

    function makeAIMove() {
        if (!gameActive) return;
        const emptyIndices = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
        if (emptyIndices.length === 0) return;

        let chosenIndex;

        if (difficulty === 'SuperEasy') {
            chosenIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        } else if (difficulty === 'Easy') {
            // 65% aléatoire, 35% intelligent
            if (Math.random() < 0.65) {
                chosenIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else {
                chosenIndex = getSmartMove(emptyIndices);
            }
        } else {
            // Difficile : logique tactique rapide sans blocage
            chosenIndex = getSmartMove(emptyIndices);
        }

        makeMove(chosenIndex, 'O');
    }

    function getSmartMove(emptyIndices) {
        // 1. Gagner immédiatement si possible
        for (let idx of emptyIndices) {
            board[idx] = 'O';
            if (checkWin('O')) { board[idx] = ''; return idx; }
            board[idx] = '';
        }
        // 2. Bloquer le joueur X s'il va gagner
        for (let idx of emptyIndices) {
            board[idx] = 'X';
            if (checkWin('X')) { board[idx] = ''; return idx; }
            board[idx] = '';
        }
        // 3. Prendre le centre
        if (emptyIndices.includes(4)) return 4;
        // 4. Prendre un coin disponible
        const corners = [0, 2, 6, 8].filter(c => emptyIndices.includes(c));
        if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];
        // 5. Sinon case aléatoire
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    }

    function checkWin(player) {
        for (let pattern of WIN_PATTERNS) {
            if (pattern.every(index => board[index] === player)) {
                return pattern;
            }
        }
        return null;
    }

    function endGame(winner, winCombo = []) {
        gameActive = false;
        clearInterval(turnTimer);
        document.getElementById('timerContainer').style.display = 'none';

        if (winner === 'Draw') {
            playSound('draw');
            scores.Draw++;
            document.getElementById('statusText').textContent = "Match Nul !";
            addXP(15);
        } else {
            playSound('win');
            scores[winner]++;
            winCombo.forEach(idx => cells[idx].classList.add('win-cell'));
            
            const winName = gameMode === 'AI' 
                ? (winner === 'X' ? 'Victoire ! 🎉' : 'L\'IA a gagné ! 🤖')
                : `Joueur ${winner === 'X' ? '1' : '2'} gagne ! 🎉`;
            document.getElementById('statusText').textContent = winName;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
            }

            // Progression si le joueur gagne (ou en 2P)
            if (winner === 'X' || gameMode === '2P') {
                playerData.totalWins++;
                playerData.streak++;
                addXP(40);
                checkAchievements(winner);
            } else {
                playerData.streak = 0;
                addXP(10);
            }
            saveData();
        }
        updateScoreboard();
    }

    function addXP(amount) {
        playerData.xp += amount;
        const needed = playerData.level * 100;
        if (playerData.xp >= needed) {
            playerData.xp -= needed;
            playerData.level++;
        }
        saveData();
    }

    function checkAchievements(winner) {
        const unlock = (id) => {
            if (!playerData.achievements.includes(id)) {
                playerData.achievements.push(id);
            }
        };

        if (playerData.totalWins >= 1) unlock('first_win');
        if (board.filter(c => c === winner).length === 3) unlock('fast_win');
        if (gameMode === 'AI' && difficulty === 'Hard' && winner === 'X') unlock('bot_slayer');
        if (playerData.streak >= 3) unlock('on_fire');
    }

    function startTurnTimer() {
        clearInterval(turnTimer);
        const container = document.getElementById('timerContainer');
        const fill = document.getElementById('timerFill');

        if (!speedMode || !gameActive) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'block';
        timeLeft = 5000;
        fill.style.width = '100%';

        turnTimer = setInterval(() => {
            timeLeft -= 100;
            fill.style.width = `${(timeLeft / 5000) * 100}%`;
            if (timeLeft <= 0) {
                clearInterval(turnTimer);
                // Coup aléatoire forcé si le temps est écoulé
                const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                if (empty.length > 0 && gameActive) {
                    makeMove(empty[Math.floor(Math.random() * empty.length)], currentTurn);
                }
            }
        }, 100);
    }

    function resetGame() {
        board = Array(9).fill('');
        moveHistory = { X: [], O: [] };
        currentTurn = 'X';
        gameActive = true;
        renderBoard();
        updateStatus();
        startTurnTimer();
    }

    function updateStatus() {
        if (gameMode === 'AI') {
            document.getElementById('statusText').textContent = currentTurn === 'X' ? "À votre tour (X)" : "L'IA réfléchit...";
        } else {
            document.getElementById('statusText').textContent = `Au tour du Joueur ${currentTurn === 'X' ? '1 (X)' : '2 (O)'}`;
        }
    }

    function updateScoreboard() {
        document.getElementById('scoreX').textContent = scores.X;
        document.getElementById('scoreO').textContent = scores.O;
        document.getElementById('scoreDraw').textContent = scores.Draw;
    }

    function updateProgressionUI() {
        document.getElementById('levelBadge').textContent = `Niv. ${playerData.level}`;
        const needed = playerData.level * 100;
        document.getElementById('xpText').textContent = `${playerData.xp} / ${needed} XP`;
        document.getElementById('xpBarFill').style.width = `${(playerData.xp / needed) * 100}%`;
        document.getElementById('totalWinsBadge').textContent = playerData.totalWins;

        document.body.className = playerData.theme === 'default' ? '' : `theme-${playerData.theme}`;
    }

    function sendTaunt(emoji) {
        const el = document.createElement('div');
        el.className = 'floating-taunt';
        el.textContent = emoji;
        document.getElementById('gameContainer').appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    // --- MODALES ---
    function openModal(id) {
        if (id === 'shopModal') renderShop();
        if (id === 'achievementsModal') renderAchievements();
        document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function renderShop() {
        const renderList = (items, containerId, currentVal, key) => {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const unlocked = playerData.totalWins >= item.req;
                const div = document.createElement('div');
                div.className = `skin-item ${currentVal === item.id ? 'selected' : ''} ${!unlocked ? 'locked' : ''}`;
                div.innerHTML = `<span>${item.label}</span><span>${unlocked ? (currentVal === item.id ? '✅' : '') : `🔒 ${item.req} 🏆`}</span>`;
                if (unlocked) {
                    div.onclick = () => {
                        playSound('click');
                        playerData[key] = item.id;
                        saveData();
                        renderBoard();
                        renderShop();
                    };
                }
                container.appendChild(div);
            });
        };

        renderList(SKINS_X, 'skinsXGrid', playerData.skinX, 'skinX');
        renderList(SKINS_O, 'skinsOGrid', playerData.skinO, 'skinO');
        renderList(THEMES, 'themesGrid', playerData.theme, 'theme');
    }

    function renderAchievements() {
        const list = document.getElementById('achievementsList');
        list.innerHTML = '';
        ACHIEVEMENTS_DATA.forEach(ach => {
            const unlocked = playerData.achievements.includes(ach.id);
            const div = document.createElement('div');
            div.className = `achievement-item ${unlocked ? 'unlocked' : ''}`;
            div.innerHTML = `
                <div style="font-size: 1.8rem;">${ach.icon}</div>
                <div>
                    <div style="font-weight: bold; font-size: 0.9rem;">${ach.title}</div>
                    <div style="font-size: 0.8rem; color: #94a3b8;">${ach.desc}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    // Initialisation au chargement
    setGameMode('AI');
    updateProgressionUI();
</script>
